[package]
name = "wokwi-elements-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust/WASM reimplementation of Wokwi Elements"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

[features]
default = []
debug-hook = ["dep:console_error_panic_hook"]
native-pack = []

[build-dependencies]
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
lto = true
opt-level = "s"

